const KEY="hcmc-d1-done", DKEY="hcmc-day"; let done={}, cur=0;
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
try{const v=+localStorage.getItem(DKEY);if(DAYS[v])cur=v}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const L=(m,tt,na)=>(m?`<a class="btn" target="_blank" rel="noopener" href="${m}">MAP</a>`:"")+(tt?`<a class="btn tt" target="_blank" rel="noopener" href="${tt}">${/\/(search|discover)/.test(tt)?"TT SEARCH":"TIKTOK"}</a>`:"")+(na?`<span class="btn na">รอชื่อร้าน + พิกัด</span>`:"");
let filt=null;
const D=()=>DAYS[cur];

function renderDays(){
 document.getElementById("days").innerHTML=DAYS.map((d,i)=>`<button data-day="${i}" aria-pressed="${i===cur}"><b>DAY ${d.n}</b><small>${d.th}</small></button>`).join("");
 const d=D();
 document.getElementById("h1").textContent="DAY "+d.n;
 document.getElementById("meta").textContent=d.meta;
 document.getElementById("foot").textContent=d.foot;
 document.title="Saigon Day "+d.n;
}
function renderPlan(){
 const el=document.getElementById("plan");
 el.innerHTML=D().blocks.map(b=>`<section class="block"><h2>${b.k}<small>${b.en}</small></h2><div class="list">
  ${b.split?`<div class="split-head"><span>13:00–16:00 · แยกกลุ่ม</span><div class="chips">${groups.map(g=>`<button class="chip" data-g="${g.id}" aria-pressed="${filt===g.id}"><i class="dot" style="background:var(${g.c})"></i>${g.name.replace("กลุ่ม","")}</button>`).join("")}</div></div>
  <div class="groups">${groups.map(g=>`<div class="grp ${filt&&filt!==g.id?"dim":""}" style="background:var(${g.s})"><h3><i class="dot" style="background:var(${g.c})"></i>${g.name}</h3><div class="who">${g.who}</div>${g.list?`<ol>${g.list.map(x=>`<li>${x}</li>`).join("")}</ol>`:`<p>${g.p}</p>`}${g.cta?`<a class="cta" target="_blank" rel="noopener" href="${g.cta[1]}" style="border-color:var(${g.c})">${g.cta[0]} ↗</a>`:""}</div>`).join("")}</div>`:""}
  ${b.items.map(i=>`<div class="item ${done[i.id]?"done":""}" id="it-${i.id}" data-s="${i.s??""}" data-e="${i.e??""}">
    <button class="chk" data-id="${i.id}" aria-label="ทำแล้ว: ${i.w}">${done[i.id]?"✓":""}</button>
    <div class="t">${i.t}</div>
    <div class="what"><strong>${i.w}</strong>${i.n?`<span>${i.n}</span>`:""}</div>
    <div class="links">${L(i.m,i.tt,i.na)}</div></div>`).join("")}
 </div></section>`).join("");
 tick();
}
function renderPlaces(){
 document.getElementById("places").innerHTML=D().places.map(s=>`<section class="block"><h2>${s.k}</h2><div class="route">
  ${s.rows.map(r=>`<div class="place"><div class="n" style="${s.route?"":"font:700 12px var(--f-mono);color:var(--muted)"}">${r[0]}</div><div><strong>${r[1]}</strong><span>${r[2]}</span></div><div class="links">${L(r[3],r[4],!r[3]&&!r[4]&&cur<2)}</div></div>`).join("")}
 </div></section>`).join("");
}
function renderAll(){renderDays();renderPlan();renderPlaces()}
function progress(){
 const all=D().blocks.flatMap(b=>b.items), n=all.filter(i=>done[i.id]).length;
 document.getElementById("pbar").style.width=(n/all.length*100)+"%";
 document.getElementById("ptxt").textContent=`${n}/${all.length}`;
}
function tick(){
 const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
 const g=t=>p.find(x=>x.type===t).value, hh=+g("hour")%24, mm=+g("minute"), day=`${g("year")}-${g("month")}-${g("day")}`;
 document.getElementById("clk").textContent=`${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
 const d=D(), trip=new Date(d.date+"T00:00:00+07:00"), days=Math.ceil((trip-Date.now())/864e5);
 document.getElementById("cd").textContent= day===d.date?`วันนี้คือ Day ${d.n}`:days>0?`อีก ${days} วันถึง Day ${d.n}`:"";
 const now=hh*60+mm;
 document.querySelectorAll(".item").forEach(el=>{
  el.classList.remove("now"); el.querySelector(".now-tag")?.remove();
  const s=+el.dataset.s,e=+el.dataset.e;
  if(day===d.date&&el.dataset.s&&now>=s&&now<e){el.classList.add("now");el.querySelector(".what strong").insertAdjacentHTML("beforeend","<span class='now-tag'>NOW</span>")}
 });
 progress();
}
document.addEventListener("click",e=>{
 const dy=e.target.closest(".days button"); if(dy){cur=+dy.dataset.day;filt=null;try{localStorage.setItem(DKEY,cur)}catch(_){};renderAll();window.scrollTo({top:0});return}
 const c=e.target.closest(".chk"); if(c){const id=c.dataset.id;done[id]=!done[id];save();renderPlan();return}
 const ch=e.target.closest(".chip"); if(ch){filt=filt===ch.dataset.g?null:ch.dataset.g;renderPlan();return}
 const t=e.target.closest(".tabs button"); if(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b===t));
  document.getElementById("plan").hidden=t.dataset.v!=="plan"; document.getElementById("places").hidden=t.dataset.v!=="places";
 }
});
// auto-open today's day if trip day
(()=>{const t=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh"}).format(new Date());const i=DAYS.findIndex(d=>d.date===t);if(i>=0)cur=i})();
renderAll(); setInterval(tick,30000);
</script>
