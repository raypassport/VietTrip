/* checkbox micro-interaction — press on pointer-down, fill grows from center, tick draws */
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
.chk{position:relative;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);cursor:pointer;padding:0;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform 120ms var(--ease-out),border-color 160ms ease}

.chk svg{position:absolute;inset:0;margin:auto;width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk svg path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset 200ms var(--ease-out)}
.item.done .chk{border-color:var(--accent)}

.item .what strong b{font-weight:inherit;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size 300ms var(--ease-out)}
.item.done .what strong{color:var(--done)}

.item .th,.item .links{transition:opacity 240ms ease}
/* whole-card press: sinks on pointer-down, springs back on release */
.item .card{transform-origin:center;transition:transform 320ms var(--ease-out),box-shadow 320ms var(--ease-out)}
.item .card:has(.chk:active){transform:scale(.97);box-shadow:0 1px 2px rgba(13,20,34,.06);transition-duration:140ms}

@media (prefers-reduced-motion:reduce){.chk,.chk .fill,.chk svg path,.item .what strong b,.progress i span{transition-duration:0ms!important;transition-delay:0ms!important}.chk .fill{transition:opacity 150ms ease!important}}

function thumbs(){
 TMP.then(m=>document.querySelectorAll("img.thumb[data-tt]").forEach(img=>{
  const f=m[img.dataset.tt]; if(!f){const w=img.closest(".pimg");img.remove();if(w)w.remove();return}
  img.onerror=()=>img.remove(); img.src=f; img.hidden=false;
 }));
}
function renderPlaces(){
 const its=D().blocks.flatMap(b=>b.items); let k=0;
 const tm=r=>{if(r[5])return r[5];for(let j=k;j<its.length;j++){const i=its[j];if((r[4]&&i.tt===r[4])||(r[3]&&i.m===r[3])){k=j+1;return i.t}}return ""};
 document.getElementById("places").innerHTML=D().places.map(s=>`<section class="block"><h2>${s.k}</h2><div class="pgrid">
  ${s.rows.map(r=>`<div class="pcard"><div class="pbody">${(t=>t?`<b class="pn">${t}</b>`:"")(tm(r))}<strong>${r[1]}</strong>${r[2]?`<span>${r[2]}</span>`:""}</div>
   ${(r[4]||r[3])?`<div class="pimg"><img class="thumb" alt="" loading="lazy" data-tt="${r[4]||r[3]}" hidden></div>`:""}
   <div class="pbtn">${r[3]?`<a class="btn" target="_blank" rel="noopener" href="${r[3]}">MAP</a>`:""}${r[4]?`<a class="btn tt" target="_blank" rel="noopener" href="${r[4]}">TIKTOK</a>`:""}</div></div>`).join("")}
 </div></section>`).join("");
 thumbs();
}
function renderAll(){renderDays();renderPlan();renderPlaces()}
function progress(){
 const all=D().blocks.flatMap(b=>b.items), n=all.filter(i=>done[i.id]).length;
 document.getElementById("pbar").style.transform=`scaleX(${n/all.length})`;
 document.getElementById("ptxt").innerHTML=`${n}<em>/${all.length}</em>`;
}
function tick(){
 const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
 const g=t=>p.find(x=>x.type===t).value, hh=+g("hour")%24, mm=+g("minute"), day=`${g("year")}-${g("month")}-${g("day")}`;
 document.getElementById("clk").textContent=`${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
 const d=D(), trip=new Date(d.date+"T00:00:00+07:00"), days=Math.ceil((trip-Date.now())/864e5);
 document.getElementById("cd").textContent= day===d.date?`วันนี้คือ Day ${d.n}`:days>0?`อีก ${days} วันถึง Day ${d.n}`:"";
 const now=hh*60+mm;
 document.querySelectorAll(".item").forEach(el=>{
  el.classList.remove("now"); el.querySelector(".now-tag")?.remove();
  const s=+el.dataset.s,e=+el.dataset.e;
  if(day===d.date&&el.dataset.s&&now>=s&&now<e){el.classList.add("now");el.querySelector(".what strong").insertAdjacentHTML("beforeend","<span class='now-tag'>NOW</span>")}
 });
 progress();
}
document.addEventListener("click",e=>{
 const dy=e.target.closest(".days button"); if(dy){cur=+dy.dataset.day;filt=null;try{localStorage.setItem(DKEY,cur)}catch(_){};renderAll();window.scrollTo({top:0});return}
 const nb=e.target.closest(".note"); if(nb){openSheet(nb.dataset.note);return}
 if(e.target.closest("[data-close]")){closeSheet();return}
 const c=e.target.closest(".chk"); if(c){const id=c.dataset.id;done[id]=!done[id];save();c.closest(".item").classList.toggle("done",!!done[id]);c.setAttribute("aria-checked",!!done[id]);if(done[id]&&navigator.vibrate)navigator.vibrate(8);progress();return}
 const ch=e.target.closest(".chip"); if(ch){filt=filt===ch.dataset.g?null:ch.dataset.g;renderPlan();return}
 const t=e.target.closest(".tabs button"); if(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b===t));
  document.getElementById("plan").hidden=t.dataset.v!=="plan"; document.getElementById("places").hidden=t.dataset.v!=="places";
 }
});
// auto-open today's day if trip day
(()=>{const t=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh"}).format(new Date());const i=DAYS.findIndex(d=>d.date===t);if(i>=0)cur=i})();
renderAll(); setInterval(tick,30000);
const WM_ART=`<svg class="wm-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" font-family="Bai Jamjuree, sans-serif"> <defs> <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcdcd6"/></linearGradient> <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9be6"/><stop offset="1" stop-color="#8cc6f2"/></linearGradient> <clipPath id="win"><rect x="62" y="62" width="236" height="316" rx="96"/></clipPath> <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3b2a1e" flood-opacity=".25"/></filter> </defs> <rect x="14" y="14" width="332" height="412" rx="150" fill="url(#fr)" stroke="#d6d4cc" stroke-width="2"/> <rect x="40" y="40" width="280" height="360" rx="120" fill="#ecebe6" stroke="#d6d4cc" stroke-width="2"/> <g clip-path="url(#win)"> <rect x="62" y="62" width="236" height="316" fill="url(#sky)"/> <g fill="#fff" opacity=".95"><ellipse cx="250" cy="250" rx="46" ry="16"/><ellipse cx="228" cy="240" rx="22" ry="16"/><ellipse cx="262" cy="236" rx="18" ry="14"/> <ellipse cx="96" cy="300" rx="40" ry="13"/><ellipse cx="112" cy="290" rx="18" ry="13"/></g> <path d="M140 378 L300 300 L300 330 L190 378Z" fill="#f4f3ef"/><path d="M140 378 L300 300" stroke="#d6d4cc" stroke-width="2"/> <rect x="62" y="62" width="236" height="40" fill="#e7e6e1"/> </g> <rect x="62" y="62" width="236" height="316" rx="96" fill="none" stroke="#cfcdc5" stroke-width="3"/> <!-- boarding card --> <g transform="rotate(-3 180 150)" filter="url(#sh)"> <rect x="122" y="92" width="118" height="148" rx="12" fill="#f6efe0" stroke="#3b2a1e" stroke-width="3"/> <text x="181" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#3b2a1e">XIN CHÀO</text> <line x1="138" y1="130" x2="224" y2="130" stroke="#3b2a1e" stroke-width="2"/> <text x="181" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2a1e">BKK → SGN</text> <rect x="125" y="162" width="112" height="22" fill="#3b2a1e"/> <text x="181" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#f6efe0" letter-spacing="2">21–24 OCT</text> <circle cx="181" cy="210" r="16" fill="none" stroke="#3b2a1e" stroke-width="2.5"/><path d="M165 210h32M181 194v32M170 199q11 11 22 0M170 221q11-11 22 0" fill="none" stroke="#3b2a1e" stroke-width="2"/> <rect x="165" y="84" width="34" height="14" rx="2" fill="#efe9d8" opacity=".9" transform="rotate(4 182 91)"/> </g> <!-- flag sticker --> <g transform="rotate(-12 92 120)" filter="url(#sh)"><rect x="68" y="102" width="52" height="36" rx="5" fill="#fff"/><rect x="72" y="106" width="44" height="28" rx="3" fill="#da251d"/> <path d="M94 111l2.6 7.8h8.2l-6.6 4.8 2.5 7.8-6.7-4.8-6.7 4.8 2.5-7.8-6.6-4.8h8.2z" fill="#ffcd00"/></g> <!-- non la hat sticker --> <g transform="rotate(8 270 205)" filter="url(#sh)"><path d="M228 222 L270 176 L312 222 Q270 236 228 222Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/> <path d="M228 222 L270 176 L312 222 Q270 236 228 222Z" fill="#f2d27a" stroke="#3b2a1e" stroke-width="2.5" stroke-linejoin="round"/> <path d="M249 199 Q270 206 291 199M238 211 Q270 220 302 211" fill="none" stroke="#3b2a1e" stroke-width="1.8"/></g> <!-- pho bowl sticker --> <g transform="rotate(-6 112 272)" filter="url(#sh)"><circle cx="112" cy="268" r="34" fill="#fff"/> <path d="M84 262 h56 q-4 26-28 26 q-24 0-28-26z" fill="#e0825a" stroke="#3b2a1e" stroke-width="2.5" stroke-linejoin="round"/> <path d="M90 262 q22-10 44 0" fill="#f6efe0" stroke="#3b2a1e" stroke-width="2"/><path d="M118 236 l18 22M124 234 l16 24" stroke="#3b2a1e" stroke-width="2.5" stroke-linecap="round"/> <path d="M100 248 q4-6 0-12M110 246 q4-6 0-12" fill="none" stroke="#9aa8bd" stroke-width="2" stroke-linecap="round"/></g> <!-- note card --> <g transform="rotate(4 228 318)" filter="url(#sh)"><path d="M176 280 h108 v58 l-14 14 h-94z" fill="#fff"/><path d="M284 338 l-14 14 v-14z" fill="#e7e6e1"/> <text x="230" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#3b2a1e">VIETNAM TRIP</text> <text x="230" y="322" text-anchor="middle" font-size="10" fill="#3b2a1e" letter-spacing="1">13 FRIENDS · 4 DAYS</text> <text x="230" y="340" text-anchor="middle" font-size="10" fill="#3b2a1e">HO CHI MINH CITY</text></g> <!-- scooter sticker --> <g transform="rotate(-8 112 352)" filter="url(#sh)"><rect x="80" y="330" width="66" height="44" rx="22" fill="#fff"/> <circle cx="96" cy="362" r="8" fill="#3b2a1e"/><circle cx="132" cy="362" r="8" fill="#3b2a1e"/><path d="M92 354 h22 q8-14 18-14 l4-6" fill="none" stroke="#2f7ff0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/> <path d="M100 352 q6-12 18-10" fill="#2f7ff0"/></g> <!-- round stamp --> <g transform="rotate(-14 272 372)"><circle cx="272" cy="372" r="26" fill="#3b2a1e"/><text x="272" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#f6efe0">SGN</text><text x="272" y="383" text-anchor="middle" font-size="8" fill="#f6efe0">2026</text></g> </svg>`;
/* ---- people + onboarding ---- */
const PPL=[["เรจิ","#2fbfa5","lm"],["มีน","#2fbfa5","lm"],["คิน","#2fbfa5","lm"],["โอลี่","#9b5fd6","bt"],["ปราง","#9b5fd6","bt"],["แพรว","#9b5fd6","bt"],["ติว","#9b5fd6","bt"],["แบม","#5aa83a","sh"],["เต้","#4a6fdc","ch"],["โอ","#4a6fdc","ch"],["ฟร้อง","#8b6a55","fr"],["กาย","#8b6a55","fr"]];
const LINE={lm:"สายแลนด์มาร์ก · บ่ายวันแรกเดินเก็บ 5 ที่ 🏛️",bt:"กลุ่มทำสวย · บ่ายวันแรกต่อขนตา 💅",sh:"สายช้อป · บ่ายวันแรกตะลุยช้อปปิ้ง 🛍️",ch:"กลุ่มชาริเต้ + โอ · บ่ายวันแรกเที่ยวตามใจ ✨",fr:"กลุ่มฟร้อง + กาย · บ่ายวันแรกแพลนอิสระ 🗺️"};
const DAYMSG=[null,["☕️","วันนี้สายคาเฟ่ทั้งวัน<br>ปิดท้ายด้วยสตรีทฟู้ดกับบาร์ 🍸"],["🛕","ไหว้วัดแขก ช้อปปิ้ง<br>แล้วไปต่อที่บุ่ยเหวียน 🌙"],["🧳","วันสุดท้ายแล้ว ซื้อของฝาก กินหอย<br>แล้วบินกลับ 21:30 ✈️"]];
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ini=n=>/^[เแโใไ]/.test(n)?n[1]:n[0];
let ME=LS.get("hcmc-me",null);
function renderMe(){const p=PPL.find(x=>x[0]===ME),b=document.getElementById("me");
 b.textContent=p?ini(p[0]):"?";b.style.background=p?p[1]:"#d9dadf";document.getElementById("myname").textContent=p?p[0]:"เลือกว่าคุณเป็นใคร";}
const WM=document.getElementById("wm"),WMC=document.getElementById("wmc"),WMI=document.getElementById("wmi");
let wmStep=null,pick=null,wmClosable=false;
function wmHTML(st){
 const x=wmClosable?'<button class="x" data-wm="close" aria-label="ปิด">×</button>':"";
 if(st==="intro")return `${WM_ART}<h3>Welcome to Vietnam Trip</h3><p>21–24 ต.ค. · แก๊ง 13 คน<br>ตาราง แผนที่ ร้านเด็ด อยู่ที่นี่หมดแล้ว</p><button class="go" data-wm="next">เริ่มเลย</button>`;
 if(st==="pick")return `${x}<h3>คุณคือใครในทริปนี้</h3><p>เลือกชื่อตัวเอง</p><div class="ppl${pick?" has":""}">${PPL.map(p=>`<button class="pp${pick===p[0]?" on":""}" data-p="${p[0]}"><span class="av" style="background:${p[1]}">${ini(p[0])}</span>${p[0]}</button>`).join("")}</div><button class="go" data-wm="me" ${pick?"":"disabled"}>${pick?"ฉันคือ "+pick:"เลือกชื่อก่อน"}</button>`;
 if(st==="hello"){const p=PPL.find(x=>x[0]===ME);return `<div class="big" style="background:${p[1]}">${ini(p[0])}</div><div class="hi">ยินดีต้อนรับ</div><div class="nm">${p[0]}</div><p>${LINE[p[2]]}</p><button class="go" data-wm="close">Enjoy your trip ✈️</button>`}
 if(typeof st==="number"){const m=DAYMSG[st];return `<div class="emo">${m[0]}</div><h3>เข้าสู่วันที่ ${st+1} แล้ว${ME?" "+ME:""}!</h3><p>${m[1]}</p><button class="go" data-wm="close">ไปกันเลย</button>`}
}
function wmShow(st){
 if(!WM.open){wmStep=st;WMI.innerHTML=wmHTML(st);WMC.style.height="";WM.classList.remove("closing","open");WM.showModal();WMC.getBoundingClientRect();requestAnimationFrame(()=>WM.classList.add("open"));return}
 const h0=WMC.offsetHeight;WMC.style.height=h0+"px";WMI.classList.add("swap");
 setTimeout(()=>{wmStep=st;WMI.innerHTML=wmHTML(st);WMC.style.height=WMI.offsetHeight+"px";requestAnimationFrame(()=>WMI.classList.remove("swap"));setTimeout(()=>{WMC.style.height=""},360)},140);
}
function wmRefresh(){const h0=WMC.offsetHeight;WMI.innerHTML=wmHTML(wmStep);WMC.style.height=h0+"px";WMC.getBoundingClientRect();WMC.style.height=WMI.offsetHeight+"px";setTimeout(()=>{WMC.style.height=""},360)}
function wmClose(){if(!WM.open||WM.classList.contains("closing"))return;WM.classList.add("closing");WM.classList.remove("open");
 setTimeout(()=>{WM.classList.remove("closing");WM.close();if(wmStep==="hello"){LS.set("hcmc-onb",1);maybeNewDay()}},220)}
WM.addEventListener("cancel",e=>{e.preventDefault();if(wmClosable||typeof wmStep==="number"||wmStep==="hello")wmClose()});
WM.addEventListener("click",e=>{
 const a=e.target.closest("[data-wm]"),p=e.target.closest("[data-p]");
 if(p){pick=p.dataset.p;wmRefresh();return}
 if(!a)return;const v=a.dataset.wm;
 if(v==="next")wmShow("pick");
 else if(v==="me"&&pick){ME=pick;LS.set("hcmc-me",ME);renderMe();wmClosable?(LS.set("hcmc-onb",1),wmClose()):wmShow("hello")}
 else if(v==="close")wmClose();
});
function maybeNewDay(){const t=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh"}).format(new Date()),i=DAYS.findIndex(d=>d.date===t),seen=LS.get("hcmc-days",[]);
 if(i>0&&!seen.includes(i)){LS.set("hcmc-days",seen.concat(i));wmClosable=false;wmShow(i)}}
function openPicker(){pick=ME;wmClosable=true;wmShow("pick")}
document.getElementById("me").addEventListener("click",openPicker);document.getElementById("who").addEventListener("click",openPicker);
renderMe();
if(!LS.get("hcmc-onb",0)){wmClosable=false;wmShow("intro")}else maybeNewDay();

</script>
