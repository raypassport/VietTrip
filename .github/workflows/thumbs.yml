name: TikTok thumbnails
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, scripts/fetch_thumbs.py]
  schedule:
    - cron: "0 20 * * *"
concurrency:
  group: thumbs
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 scripts/fetch_thumbs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs
          git diff --cached --quiet || (git commit -m "Update TikTok thumbnails [skip ci]" && git push)
